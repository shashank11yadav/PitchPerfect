name: CI

# Pull requests run here; a push runs only on main, so a push to a PR branch isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the run it supersedes. Runs on main all finish, so
# every merged commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dead
      - run: npm audit --audit-level=high
      # A tag can be moved to other code; a commit SHA can't. Dependabot updates the SHA and comment.
      - name: Check every action is pinned to a commit SHA
        run: |
          unpinned=$(grep -rnE 'uses:[[:space:]]*[^[:space:]#]+@' .github/workflows \
            | grep -vE '@[0-9a-f]{40}[[:space:]]+# v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "Pin each action above to a full commit SHA followed by a # vX.Y.Z comment."
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: scripts/start-mongo.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds every workspace, then Playwright starts coach (COACH_PROVIDER=fake), api and
      # `next start` itself (e2e/playwright.config.ts) on a throwaway database.
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The static GitHub Pages demo: builds apps/web/out and checks it in a browser. No database.
  e2e-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-pages
          path: |
            playwright-report/pages/
            test-results/pages/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: scripts/start-mongo.sh
      - run: npm ci
      - run: npm run build
      # /jobs renders the seeded job board, so the api (and the practice partner it checks) runs too.
      - name: Seed and start the api and practice partner
        env:
          # An unset NODE_ENV is production, which refuses these placeholder secrets and plain http.
          NODE_ENV: development
          MONGODB_URI: mongodb://localhost:27017/pitchperfect-lighthouse
          APP_URL: http://localhost:3000
          SESSION_SECRET: dev-only-ci-session-secret-000000000000000
          CSRF_SECRET: dev-only-ci-csrf-secret-0000000000000000000
          COACH_URL: http://127.0.0.1:4100
          COACH_SHARED_SECRET: dev-only-ci-coach-shared-secret-00000000000
          PROXY_SHARED_SECRET: dev-only-ci-proxy-shared-secret-00000000000
          COACH_PROVIDER: fake
          HIBP_ENABLED: "false"
          LOG_LEVEL: warn
        run: |
          npm run admin -w apps/api -- migrate
          npm run seed -w apps/api
          nohup npm run start -w apps/coach > coach.log 2>&1 &
          nohup npm run start -w apps/api > api.log 2>&1 &
          for attempt in $(seq 30); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 1
          done
          cat api.log coach.log
          exit 1
      # Starts `next start` and checks /, /students and /jobs (lighthouserc.json). `next start` runs
      # as production, which requires the proxy secret the api above was given.
      - run: npm run lighthouse
        env:
          PROXY_SHARED_SECRET: dev-only-ci-proxy-shared-secret-00000000000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  # Builds the three container images (nothing is pushed), so a broken Dockerfile fails CI.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f apps/coach/Dockerfile -t pitchperfect-coach:ci .
      - run: docker build -f apps/api/Dockerfile -t pitchperfect-api:ci .
      - run: docker build -f apps/web/Dockerfile -t pitchperfect-web:ci .

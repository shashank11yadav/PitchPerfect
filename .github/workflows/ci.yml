name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dead
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: scripts/start-mongo.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds every workspace, then Playwright starts coach (COACH_PROVIDER=fake), api and
      # `next start` itself (e2e/playwright.config.ts) on a throwaway database.
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The static GitHub Pages demo: builds apps/web/out and checks it in a browser. No database.
  e2e-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:pages
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-pages
          path: |
            playwright-report/pages/
            test-results/pages/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: scripts/start-mongo.sh
      - run: npm ci
      - run: npm run build
      # /jobs renders the seeded job board, so the api (and the practice partner it checks) runs too.
      - name: Seed and start the api and practice partner
        env:
          MONGODB_URI: mongodb://localhost:27017/pitchperfect-lighthouse
          APP_URL: http://localhost:3000
          SESSION_SECRET: dev-only-ci-session-secret-000000000000000
          CSRF_SECRET: dev-only-ci-csrf-secret-0000000000000000000
          COACH_URL: http://127.0.0.1:4100
          COACH_SHARED_SECRET: dev-only-ci-coach-shared-secret-00000000000
          COACH_PROVIDER: fake
          HIBP_ENABLED: "false"
          LOG_LEVEL: warn
        run: |
          npm run admin -w apps/api -- migrate
          npm run seed -w apps/api
          nohup npm run start -w apps/coach > coach.log 2>&1 &
          nohup npm run start -w apps/api > api.log 2>&1 &
          for attempt in $(seq 30); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 1
          done
          cat api.log coach.log
          exit 1
      # Starts `next start` and checks /, /students and /jobs (lighthouserc.json).
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  # Builds the three container images (nothing is pushed), so a broken Dockerfile fails CI.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/coach/Dockerfile -t pitchperfect-coach:ci .
      - run: docker build -f apps/api/Dockerfile -t pitchperfect-api:ci .
      - run: docker build -f apps/web/Dockerfile -t pitchperfect-web:ci .

name: Pages

# The static demo (docs/deploy.md, "GitHub Pages demo"): built from main and published to
# https://shashank11yadav.github.io/PitchPerfect/. No api, coach or database runs there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the one in flight rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds apps/web/out, then checks it the way the CI job does; a failing demo is not uploaded.
      - run: npm run e2e:pages
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-pages
          path: |
            playwright-report/pages/
            test-results/pages/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
